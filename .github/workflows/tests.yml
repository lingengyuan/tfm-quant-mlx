name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    # MLX wheels are Apple Silicon only. Checkpoint-dependent tests skip when
    # models/timesfm-3.0 is absent, so this job needs no model download.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . --no-deps
          pip install "timesfm[mlx]>=3.0.2" "mlx>=0.32" numpy pandas pyyaml pytest
      - name: Test
        run: python -m pytest -q
