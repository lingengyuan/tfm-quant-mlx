# Multivariate: each ETT table's 7 channels share one decode call, so the
# variate attention path runs. Compare against configs/uni_control.yaml.
datasets: [ETTh1, ETTh2, ETTm1, ETTm2]
synthetic: false
multi: true
contexts: [2048, 15360]
windows: 4
weights: [fp32, int8_g64, int4_g64, mix_l18_19_8]
kv: [affine4, affine4_l19fp16, turbo3_mse]
kv_contexts: [2048, 15360]
throughput_contexts: [2048, 15360]
throughput_batches: [1, 8]
repeats: 3
eval_batch: 32
out: results/multi.json
